[package]
name = "sodilaud"
version = "0.7.9"
description = "A lightweight, offline-first Markdown scratchpad for the desktop."
license = "GPL-3.0-or-later"
authors = ["Laas Toom", "crims0n"]
repository = "https://github.com/borgand/sodilaud"
homepage = "https://github.com/borgand/sodilaud"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sodilaud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
subtle = "2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSApplication", "NSResponder"] }
core-graphics = "0.25"
libc = "0.2"
